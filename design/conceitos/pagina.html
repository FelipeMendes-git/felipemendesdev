<!doctype html>
<!--
  Páginas-conceito da vitrine: um estilo de landing page para cada tipo de
  negócio. Nenhuma tem nome de empresa, de propósito. No lugar da marca vai
  "Sua hamburgueria", "Seu estúdio" e assim por diante, para ninguém confundir
  com um estabelecimento real nem achar que é um cliente.

  Abra com ?c=<conceito> (hamburgueria, pilates, odontologia, solar, barbearia, interiores).
  As imagens do site saem daqui: rode design/gerar-conceitos.mjs (ver README).
-->
<html lang="pt-BR">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=390" />
    <style>
      @font-face {
        font-family: 'Bodoni Moda';
        src: url('../../node_modules/@fontsource-variable/bodoni-moda/files/bodoni-moda-latin-opsz-normal.woff2')
          format('woff2-variations');
        font-weight: 400 900;
      }
      @font-face {
        font-family: 'Jost';
        src: url('../../node_modules/@fontsource-variable/jost/files/jost-latin-wght-normal.woff2')
          format('woff2-variations');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Anton';
        src: url('../../node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Cormorant';
        src: url('../../node_modules/@fontsource-variable/cormorant-garamond/files/cormorant-garamond-latin-wght-normal.woff2')
          format('woff2-variations');
        font-weight: 300 700;
      }
      @font-face {
        font-family: 'Cormorant';
        font-style: italic;
        src: url('../../node_modules/@fontsource-variable/cormorant-garamond/files/cormorant-garamond-latin-wght-italic.woff2')
          format('woff2-variations');
        font-weight: 300 700;
      }
      @font-face {
        font-family: 'Hanken';
        src: url('../../node_modules/@fontsource-variable/hanken-grotesk/files/hanken-grotesk-latin-wght-normal.woff2')
          format('woff2-variations');
        font-weight: 100 900;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        --pad: 22px;
        width: 390px;
        overflow-x: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--text);
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      img {
        display: block;
        width: 100%;
        object-fit: cover;
      }

      h1,
      h2 {
        font-family: var(--display);
        font-weight: var(--dw);
        text-transform: var(--dcase, none);
        letter-spacing: var(--dls, -0.01em);
        line-height: var(--dlh, 1.02);
        text-wrap: balance;
      }

      h1 {
        font-size: var(--h1);
      }

      h2 {
        font-size: var(--h2);
      }

      h1 em,
      h2 em {
        font-style: var(--em-style, italic);
        color: var(--em-c, inherit);
      }

      p {
        color: var(--mut);
      }

      /* Topo */
      .top {
        position: relative;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px var(--pad);
        color: var(--top-c, var(--fg));
      }

      .logo {
        font-family: var(--logo-font, var(--display));
        font-size: var(--logo-size, 20px);
        font-weight: var(--logo-w, 700);
        letter-spacing: var(--logo-ls, 0);
        text-transform: var(--logo-case, none);
        line-height: 1;
      }

      .chip {
        padding: 7px 13px;
        border: 1px solid color-mix(in srgb, currentColor 40%, transparent);
        border-radius: 99px;
        font-size: 12px;
        font-weight: 600;
      }

      /* Botão */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 15px 22px;
        border-radius: var(--btn-r, 99px);
        background: var(--acc);
        color: var(--acc-ink);
        font-size: 15px;
        font-weight: 700;
        line-height: 1;
      }

      .btn svg {
        width: 17px;
        height: 17px;
        flex: none;
      }

      .sub {
        max-width: 330px;
        margin: 14px 0 22px;
        font-size: 16px;
        line-height: 1.45;
      }

      /* Abertura: foto de fundo com o texto por cima */
      .hero--overlay {
        position: relative;
        display: flex;
        min-height: 660px;
        margin-top: -55px;
        flex-direction: column;
        justify-content: flex-end;
        padding: 0 var(--pad) 32px;
        color: var(--hero-fg, inherit);
      }

      .hero--overlay .sub {
        color: var(--hero-sub, var(--mut));
      }

      .hero--overlay > img {
        position: absolute;
        inset: 0;
        height: 100%;
        object-position: var(--hero-pos, center);
      }

      .hero--overlay::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          color-mix(in srgb, var(--hero-fade, var(--bg)) 62%, transparent) 0%,
          transparent 24%,
          color-mix(in srgb, var(--hero-fade, var(--bg)) 45%, transparent) 52%,
          var(--hero-fade, var(--bg)) 92%
        );
      }

      .hero--overlay > :not(img) {
        position: relative;
        z-index: 1;
      }

      /* Abertura: texto em cima, foto em arco embaixo */
      .hero--stack {
        padding: 26px var(--pad) 0;
        text-align: center;
      }

      .hero--stack .sub {
        margin-inline: auto;
      }

      .hero--stack > img {
        height: 430px;
        margin-top: 30px;
        border-radius: 195px 195px 18px 18px;
        object-position: var(--hero-pos, center);
      }

      /* Abertura: foto em cartão com selo flutuante */
      .hero--card {
        padding: 18px var(--pad) 0;
      }

      .hero--card .foto {
        position: relative;
        margin-top: 26px;
      }

      .hero--card .foto img {
        height: 380px;
        border-radius: 26px;
        object-position: var(--hero-pos, center);
      }

      .selo {
        position: absolute;
        bottom: -18px;
        left: 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-radius: 16px;
        background: #fff;
        color: var(--fg);
        font-size: 13px;
        font-weight: 600;
        line-height: 1.25;
        box-shadow: 0 16px 34px -14px rgb(0 0 0 / 0.35);
      }

      .selo b {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 50%;
        background: var(--acc);
        color: var(--acc-ink);
        font-size: 16px;
      }

      /* Abertura: título grande, foto sangrada e legenda */
      .hero--split {
        padding-top: 22px;
      }

      .hero--split .txt {
        padding: 0 var(--pad) 26px;
      }

      .hero--split > img {
        height: 440px;
        object-position: var(--hero-pos, center);
      }

      .legenda {
        display: flex;
        justify-content: space-between;
        padding: 10px var(--pad);
        border-bottom: 1px solid color-mix(in srgb, var(--fg) 18%, transparent);
        color: var(--mut);
        font-size: 12px;
      }

      /* Faixa de provas */
      .proof {
        display: grid;
        list-style: none;
      }

      .proof--linha {
        margin: 34px var(--pad) 0;
        border-top: 1px solid color-mix(in srgb, var(--fg) 20%, transparent);
      }

      .proof--linha li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 13px 0;
        border-bottom: 1px solid color-mix(in srgb, var(--fg) 20%, transparent);
        font-size: 14px;
        font-weight: 600;
      }

      .proof--linha li::before {
        content: '';
        width: 7px;
        height: 7px;
        flex: none;
        border-radius: 50%;
        background: var(--acc);
      }

      .proof--grade {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 44px var(--pad) 0;
      }

      .proof--grade li {
        padding: 14px 10px;
        border-radius: var(--radius, 14px);
        background: var(--sup);
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1.25;
        text-align: center;
      }

      .proof--pilulas {
        justify-content: center;
        gap: 8px;
        margin: 30px var(--pad) 0;
        grid-auto-flow: row;
        justify-items: center;
      }

      .proof--pilulas li {
        padding: 9px 16px;
        border: 1px solid color-mix(in srgb, var(--fg) 25%, transparent);
        border-radius: 99px;
        font-size: 13px;
      }

      /* Blocos */
      .bloco {
        padding: 54px var(--pad) 0;
      }

      .bloco > h2 {
        margin-bottom: 22px;
      }

      .item {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 14px;
        align-items: baseline;
      }

      .item strong {
        font-size: 16.5px;
        font-weight: 700;
      }

      .item p {
        grid-column: 2;
        font-size: 14px;
        line-height: 1.4;
      }

      .item .n {
        grid-row: span 2;
        font-family: var(--display);
        font-size: var(--n-size, 30px);
        font-weight: var(--dw);
        line-height: 1;
        color: var(--acc-t, var(--acc));
      }

      .itens--cartoes {
        display: grid;
        gap: 10px;
      }

      .itens--cartoes .item {
        padding: 18px;
        border-radius: var(--radius, 16px);
        background: var(--sup);
      }

      .itens--lista .item {
        padding: 16px 0;
        border-top: 1px solid color-mix(in srgb, var(--fg) 18%, transparent);
      }

      .itens--lista .item:last-child {
        border-bottom: 1px solid color-mix(in srgb, var(--fg) 18%, transparent);
      }

      /* Segunda foto */
      .foto2 {
        position: relative;
        margin: 54px var(--foto2-m, 0px) 0;
      }

      .foto2 img {
        height: var(--foto2-h, 300px);
        border-radius: var(--foto2-r, 0);
        object-position: var(--foto2-pos, center);
      }

      .foto2 figcaption {
        padding: 14px var(--pad) 0;
        font-family: var(--display);
        font-size: var(--cap-size, 22px);
        font-weight: var(--dw);
        font-style: var(--cap-style, normal);
        text-transform: var(--dcase, none);
        letter-spacing: var(--dls, -0.01em);
        line-height: 1.1;
      }

      /* Dúvidas */
      .faq li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 0;
        border-bottom: 1px solid color-mix(in srgb, var(--fg) 18%, transparent);
        font-size: 15px;
        font-weight: 600;
        list-style: none;
      }

      .faq li::after {
        content: '+';
        color: var(--acc-t, var(--acc));
        font-size: 20px;
        font-weight: 400;
        line-height: 1;
      }

      /* Fechamento */
      .final {
        margin: 54px var(--final-m, 0px) 0;
        padding: 44px var(--pad) 48px;
        border-radius: var(--final-r, 0);
        background: var(--final-bg, var(--acc));
        color: var(--final-fg, var(--acc-ink));
        text-align: var(--final-align, left);
      }

      .final em {
        color: inherit;
      }

      .final p {
        margin: 10px 0 22px;
        color: inherit;
        opacity: 0.8;
      }

      .final .btn {
        background: var(--final-btn, var(--acc-ink));
        color: var(--final-btn-ink, var(--acc));
      }

      .rodape {
        padding: 20px var(--pad) 26px;
        color: var(--mut);
        font-size: 12px;
        text-align: center;
      }
    </style>
  </head>

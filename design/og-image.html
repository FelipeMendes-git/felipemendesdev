<!doctype html>
<!--
  Fonte da imagem de compartilhamento (public/og-image.png, 1200x630).
  Gere com: npm i -D puppeteer-core && node design/gerar-og-image.mjs && npm un puppeteer-core
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Jost';
        src: url('../node_modules/@fontsource-variable/jost/files/jost-latin-wght-normal.woff2')
          format('woff2-variations');
        font-weight: 100 900;
      }

      @font-face {
        font-family: 'Bodoni Moda';
        font-style: italic;
        src: url('../node_modules/@fontsource-variable/bodoni-moda/files/bodoni-moda-latin-opsz-italic.woff2')
          format('woff2-variations');
        font-weight: 400 900;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0c1612;
        color: #f1ebe0;
        font-family: 'Jost', sans-serif;
      }

      .page {
        display: grid;
        height: 100%;
        grid-template-columns: 1fr auto;
        gap: 40px;
        padding: 56px 72px 0;
      }

      .texto {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding-bottom: 56px;
      }

      h1 {
        font-size: 150px;
        font-weight: 800;
        letter-spacing: -0.045em;
        line-height: 0.88;
        text-transform: uppercase;
      }

      h1 em {
        display: block;
        margin-top: 6px;
        color: #ff5c1a;
        font-family: 'Bodoni Moda', serif;
        font-variation-settings: 'opsz' 30;
        font-size: 96px;
        font-weight: 440;
        letter-spacing: -0.03em;
        line-height: 1.05;
        text-transform: none;
      }

      .rodape {
        display: flex;
        align-items: center;
        gap: 22px;
        font-size: 26px;
      }

      .nome {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.04em;
        text-transform: uppercase;
      }

      .nome em {
        color: #ff5c1a;
        font-family: 'Bodoni Moda', serif;
        font-variation-settings: 'opsz' 14;
        font-weight: 600;
        letter-spacing: -0.02em;
        text-transform: none;
      }

      .dominio {
        color: #a7ada0;
      }

      /* A mesma tela que abre o site, num aparelho que sai pela base. */
      .aparelho {
        align-self: end;
        width: 300px;
        height: 520px;
        overflow: hidden;
        border: 9px solid #060c09;
        border-bottom: 0;
        border-radius: 44px 44px 0 0;
        box-shadow: 0 0 0 1px rgb(255 255 255 / 16%);
      }

      .aparelho img {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="texto">
        <h1>Landing pages<em>que vendem.</em></h1>
        <p class="rodape">
          <span class="nome">Felipe <em>Mendes</em></span>
          <span class="dominio">devfelipemendes.com.br</span>
        </p>
      </div>
      <div class="aparelho"><img src="../src/assets/topo/topo-pagina.webp" alt="" /></div>
    </div>
  </body>
</html>

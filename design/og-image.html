<!doctype html>
<!--
  Fonte da imagem de compartilhamento (public/og-image.png, 1200x630).
  Gere com: npm i -D puppeteer-core && node design/gerar-og-image.mjs && npm un puppeteer-core
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Bricolage Grotesque';
        src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2')
          format('woff2-variations');
        font-weight: 200 800;
      }

      @font-face {
        font-family: 'Schibsted Grotesk';
        src: url('../node_modules/@fontsource-variable/schibsted-grotesk/files/schibsted-grotesk-latin-wght-normal.woff2')
          format('woff2-variations');
        font-weight: 400 900;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #131a4a;
        color: #f1f2f7;
        font-family: 'Schibsted Grotesk', sans-serif;
      }

      .page {
        display: grid;
        height: 100%;
        grid-template-columns: 1fr auto;
        gap: 40px;
        padding: 56px 72px 0;
      }

      .texto {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding-bottom: 56px;
      }

      h1 {
        font-family: 'Bricolage Grotesque', sans-serif;
        font-size: 112px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 0.94;
      }

      h1 span {
        display: inline-block;
        margin-top: 20px;
        padding: 2px 12px 8px;
        border-radius: 6px 12px 8px 10px;
        background: #ffd43b;
        color: #131a4a;
        font-size: 64px;
      }

      .rodape {
        display: flex;
        align-items: baseline;
        gap: 22px;
        font-size: 26px;
      }

      .nome {
        font-family: 'Bricolage Grotesque', sans-serif;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .dominio {
        color: #aab3e6;
      }

      /* A mesma tela que abre o site, num aparelho que sai pela base. */
      .aparelho {
        align-self: end;
        width: 290px;
        height: 520px;
        overflow: hidden;
        border: 9px solid #080c26;
        border-bottom: 0;
        border-radius: 44px 44px 0 0;
        box-shadow: 0 0 0 1px rgb(255 255 255 / 16%);
      }

      .aparelho img {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="texto">
        <h1>Desenvolvedor<br />full-stack<br /><span>e IA aplicada.</span></h1>
        <p class="rodape">
          <span class="nome">Felipe Mendes</span>
          <span class="dominio">devfelipemendes.com.br</span>
        </p>
      </div>
      <div class="aparelho"><img src="../src/assets/topo/topo-interface.webp" alt="" /></div>
    </div>
  </body>
</html>

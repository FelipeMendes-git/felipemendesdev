            "acceptedAnswer": {
              "@type": "Answer",

            "@type": "Question",

          },

            "@type": "Question",
            "name": "Consigo alterar o conteúdo depois?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim. Textos, imagens e valores ficam sob seu controle, e eu deixo uma orientação gravada de como alterar. Nos primeiros 30 dias, qualquer ajuste é por minha conta."

          },
          {
            "@type": "Question",
            "name": "Existe mensalidade?",
            "acceptedAnswer": {

            }
          },
          {
            "@type": "Question",
            "name": "E se eu não aprovar o resultado?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Você vê a proposta visual completa antes de eu programar. Refinamos nessa etapa quantas vezes for necessário. Nada é publicado sem a sua aprovação."

          }
